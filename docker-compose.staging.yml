# Staging — mismas imágenes que producción, puertos alternativos
services:
  db:
    ports:
      - "5433:5432"

  api:
    environment:
      DATABASE_URL: postgresql+psycopg://sapia:sapia_dev@db:5432/sapia
      CORS_ORIGINS: http://localhost:3001
    ports:
      - "8001:8000"

  web:
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
    ports:
      - "3001:3000"
